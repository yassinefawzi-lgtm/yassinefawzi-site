[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--shamefully-hoist"

# Indexation et sitemap activés uniquement sur le domaine de production.
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://yassinefawzi.fr"
  NEXT_PUBLIC_INDEXABLE = "true"

[context.deploy-preview.environment]
  NEXT_PUBLIC_INDEXABLE = "false"

[context.branch-deploy.environment]
  NEXT_PUBLIC_INDEXABLE = "false"

# Explicitly enable the Next.js runtime when automatic detection does not install it.
[[plugins]]
  package = "@netlify/plugin-nextjs"
